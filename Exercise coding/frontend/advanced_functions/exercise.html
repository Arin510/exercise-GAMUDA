<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <h1>Team Member Exercise</h1>

  <script>
    // 1. Sample data
    const steveData = {
      id: 1,
      firstName: "Mariam",
      lastName: "Yasin",
      hobbies: ["sleep", "eat"],
      favouriteFoods: ["nasi lemak"],
      pets: ["Milo"]
    };

    // 2. The class (ALL methods inside)
    class TeamMember {
      constructor(data) {
        this.id = data.id;
        this.firstName = data.firstName;
        this.lastName = data.lastName;
        this.hobbies = data.hobbies;
        this.favouriteFoods = data.favouriteFoods;
        this.pets = data.pets;
      }

      fullName() {
        return `${this.lastName}, ${this.firstName}`;
      }

      hasHobby(hobby) {
        return this.hobbies.includes(hobby);
      }

      addPet(petName) {
        this.pets.push(petName);
      }

      getSummary() {
        return `${this.firstName} ${this.lastName} has ${this.hobbies.length} hobbies and ${this.pets.length} pet(s).`;
      }

      clearPets() {
        if (this.pets.length === 0) {
          return;
        }
        this.pets.pop();
        this.clearPets();
      }
    } // ← class closes here, after the last method

    // 3. Create an object and test (OUTSIDE the class)
    const steve = new TeamMember(steveData);

    console.log(steve.fullName());
    console.log(steve.hasHobby("sleep"));
    console.log(steve.hasHobby("swimming"));
    console.log(steve.getSummary());

    steve.addPet("Oyen");
    console.log(steve.pets);
    console.log(steve.getSummary());

    steve.clearPets();
    console.log(steve.pets);
    console.log(steve.getSummary());

    const team = [
      new TeamMember({ id: 1, firstName: "Mariam", lastName: "Yasin", hobbies: ["sleep", "eat"], favouriteFoods: ["nasi lemak"], pets: ["Milo"] }),
      new TeamMember({ id: 2, firstName: "Aina", lastName: "Rahman", hobbies: ["reading"], favouriteFoods: ["roti canai"], pets: [] }),
      new TeamMember({ id: 3, firstName: "Jason", lastName: "Tan", hobbies: ["gaming", "football"], favouriteFoods: ["laksa"], pets: ["Bobo", "Kiki"] })
    ];

    // filter: keep only members who like football
    const footballFans = team.filter(member => member.hasHobby("football"));
    console.log("Football fans:", footballFans.map(m => m.fullName()));

    // map: turn each member into their full name
    const names = team.map(member => member.fullName());
    console.log("All names:", names);

    // reduce: add up all the pets
    const totalPets = team.reduce((sum, member) => sum + member.pets.length, 0);
    console.log("Total pets:", totalPets);

    async function loadMembersFromApi() {
      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/users");
        const users = await response.json();

        const apiMembers = users.map(user => {
        const parts = user.name.split(" ");
        const last = parts.pop();
        const first = parts.join(" ");
          return new TeamMember({
            id: user.id,
            firstName: first,
            lastName: last,
            hobbies: [],
            favouriteFoods: [],
            pets: []
          });
        });

        console.log("Loaded from API:", apiMembers.map(m => m.fullName()));
      } catch (error) {
        console.log("Failed to load:", error);
      }
    }

    loadMembersFromApi();
    console.log("Loading members...");
  </script>
</body>
</html>
