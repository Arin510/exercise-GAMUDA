<body>
    <h1>Closure</h1>
    <script>
        let counter = 0

        function add() {
            counter += 1;
        }

        add();
        add();
        add();

        // counter = 999;
        console.log("The global counter is:" + counter)

        function myCounter() {
            let count = 0;
            return function (){
                count ++;
                return count;

            };
        }

        const addOne = myCounter();

        console.log("The closure is : " + addOne());
        console.log("The closure is : " + addOne());
        console.log("The closure is : " + addOne());

        count.log("Accessing count : " + addOne());

        

    </script>
    
</body>
