<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional</title>
</head>
<body>
    <script>
        function fullName(firstName, lastName) {
            return `${firstName} ${lastName}`;
        }

        console.log(fullName("Nur", "Ain"));
        console.log(fullName("Nur", "Arif", "Hakim"));

        const xs = [1, 2, 3, 4, 5];

        console.log(xs.slice(0, 3));
        console.log(xs.slice(0, 3));
        console.log(xs.slice(0, 3));
        console.log("xs after slice", xs);


        console.log(xs.splice(0, 3));
        console.log(xs.splice(0, 3));
        console.log(xs.splice(0, 3));
        console.log("xs after splice:", xs);

    </script>
</body>
</html>
